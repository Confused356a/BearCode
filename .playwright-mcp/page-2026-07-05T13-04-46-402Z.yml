                  - generic [ref=f1e236]:
                    - generic [ref=f1e237]:
                      - generic [ref=f1e239]: 她是做什么的
                      - text: 
                    - paragraph [ref=f1e249]:
                      - text: 慕彩红目前在西安电子科技大学人工智能学院任教，是智能感知与图像理解教育部重点实验室的成员，也是IEEE高级会员 。她从2004年3月就开始在西电工作，从助教一步步晋升到现在的教授 。她还是Applied Soft Computing、PLOS One等国际期刊的编委 。‌‌‌
                      - button "参考文档，单指双击即可执行"
                      - text: ‌
                      - generic [ref=f1e255] [cursor=pointer]: 
                  - generic [ref=f1e256]:
                    - generic [ref=f1e257]:
                      - generic [ref=f1e259]: 主要研究啥方向
                      - text: 
                    - paragraph [ref=f1e269]:
                      - text: 她的研究重点集中在
                      - mark [ref=f1e270]:
                        - text: ‌
                        - strong [ref=f1e271]: 计算智能、机器学习、遥感图像处理和推荐系统
                        - text: ‌
                      - text: 这几个方向 。她主持过3项国家自然科学基金项目，包括青年基金和面上项目，还参与过横向科研项目如目标识别系统及隐身目标数字模型采购等 。她发表过50多篇学术论文，拿到了30多项国家发明专利授权 。‌‌‌
                      - button "参考文档，单指双击即可执行"
                      - text: ‌
                      - generic [ref=f1e277] [cursor=pointer]: 
                  - generic [ref=f1e278]:
                    - generic [ref=f1e279]:
                      - generic [ref=f1e281]: 有没有教书育人
                      - text: 
                    - paragraph [ref=f1e291]:
                      - text: 慕彩红在教学方面也有不少成绩，她参与建设的《人工智能导论》课程获得了国家级一流线上本科课程认定 。她编著了《简明人工智能》《人工智能导论》《智能计算模型与理论》等教材 。累计培养了41名硕士研究生，目前指导在读硕士研究生10余人及留学生博士2人 。她还获得过西安电子科技大学本科优质教学奖二等奖等教学奖项 。‌‌‌
                      - button "参考文档，单指双击即可执行"
