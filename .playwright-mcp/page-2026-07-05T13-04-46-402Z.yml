                  - strong [ref=f1e224]: 慕彩红是西安电子科技大学人工智能学院的教授和博士生导师
                  - text: ‌
                - text: ，主要研究计算智能和机器学习等领域，您可以访问她的
                - link "个人主页" [ref=f1e225] [cursor=pointer]:
